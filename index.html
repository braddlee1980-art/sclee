<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>얼굴 타이밍 맞추기 게임 V2.2</title>
    <style>
        body {
            background-color: #f0f0f0;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            font-family: 'Pretendard', sans-serif;
            overflow: hidden;
        }

        #game-container {
            position: relative;
            width: 800px;
            height: 400px;
            background-color: transparent;
            border-bottom: 2px solid #ddd;
            display: flex;
            align-items: center; 
            justify-content: center;
            overflow: hidden;
        }

        .scoreboard {
            margin-bottom: 20px;
            text-align: center;
        }
        .score-box {
            font-size: 24px;
            font-weight: bold;
            color: #333;
        }
        .high-score {
            font-size: 16px;
            color: #666;
            margin-top: 5px;
        }

        /* 가이드 (얼굴보다 10px 더 큼: 130px) */
        #target-guide {
            position: absolute;
            width: 130px;
            height: 130px;
            background-image: url('face_image_bg.png');
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
            z-index: 1;
            pointer-events: none;
            opacity: 0.7;
        }

        /* 얼굴 이미지 (기존 120px 유지) */
        #face {
            position: absolute;
            width: 120px;
            height: 120px;
            background-image: url('face_image.png');
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
            background-color: transparent;
            left: 800px; 
            z-index: 2;
        }

        .controls {
            margin-top: 30px;
            display: flex;
            gap: 15px;
        }

        button {
            padding: 12px 30px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            border: none;
            border-radius: 8px;
            transition: transform 0.1s, background-color 0.2s;
        }

        #start-btn { background-color: #4CAF50; color: white; }
        #stop-btn { background-color: #f44336; color: white; }

        button:active { transform: scale(0.95); }
        button:disabled { background-color: #ccc; cursor: not-allowed; }

        #message {
            margin-top: 15px;
            font-weight: bold;
            height: 20px;
        }
    </style>
</head>
<body>

    <div class="scoreboard">
        <div class="score-box">Score: <span id="current-score">0</span></div>
        <div class="high-score">High Score: <span id="high-score">0</span></div>
    </div>

    <div id="game-container">
        <div id="target-guide"></div>
        <div id="face"></div>
    </div>

    <div id="message"></div>

    <div class="controls">
        <button id="start-btn">시작 (Enter)</button>
        <button id="stop-btn" disabled>멈춰! (Space)</button>
    </div>

    <script>
        const face = document.getElementById('face');
        const guide = document.getElementById('target-guide');
        const container = document.getElementById('game-container');
        const startBtn = document.getElementById('start-btn');
        const stopBtn = document.getElementById('stop-btn');
        const scoreDisplay = document.getElementById('current-score');
        const highScoreDisplay = document.getElementById('high-score');
        const messageDisplay = document.getElementById('message');

        let score = 0;
        let highScore = localStorage.getItem('faceGameHighScore') || 0;
        
        const initialSpeed = 2.6; 
        let speed = initialSpeed;
        
        let position = 800;
        let isPlaying = false;
        let animationId;

        highScoreDisplay.textContent = highScore;

        // 두 이미지의 정중앙이 일치할 때의 얼굴(face)의 left 좌표 계산
        // (가이드의 중앙 위치와 얼굴의 중앙 위치를 맞춤)
        const targetX = (container.offsetWidth / 2) - (face.offsetWidth / 2);

        function update() {
            if (!isPlaying) return;

            position -= speed;
            
            if (position < -face.offsetWidth) {
                position = container.offsetWidth;
            }

            face.style.left = position + 'px';
            animationId = requestAnimationFrame(update);
        }

        function startGame() {
            if (isPlaying) return;
            
            // 이미지가 멈춰있는 상태에서 다시 시작하면 오른쪽 끝으로 초기화
            if (!isPlaying && position < container.offsetWidth) {
                position = container.offsetWidth;
                face.style.left = position + 'px';
            }

            isPlaying = true;
            startBtn.disabled = true;
            stopBtn.disabled = false;
            messageDisplay.textContent = "가이드 안으로 얼굴을 쏙 넣어보세요!";
            messageDisplay.style.color = "#333";
            
            update();
        }

        function stopGame() {
            if (!isPlaying) return;

            cancelAnimationFrame(animationId);
            isPlaying = false;
            stopBtn.disabled = true;
            
            const offset = Math.abs(position - targetX);
            const tolerance = 25; 

            if (offset <= tolerance) {
                score += 10;
                speed += 0.6;
                scoreDisplay.textContent = score;
                messageDisplay.textContent = "Perfect! 가이드 안에 정확히 들어왔습니다.";
                messageDisplay.style.color = "#4CAF50";
                
                if (score > highScore) {
                    highScore = score;
                    localStorage.setItem('faceGameHighScore', highScore);
                    highScoreDisplay.textContent = highScore;
                }
                
                setTimeout(() => {
                    position = container.offsetWidth;
                    face.style.left = position + 'px';
                    startGame();
                }, 1000);

            } else {
                messageDisplay.textContent = "범위를 벗어났습니다! 다시 도전하세요.";
                messageDisplay.style.color = "#f44336";
                score = 0;
                speed = initialSpeed;
                scoreDisplay.textContent = score;
                startBtn.disabled = false;
            }
        }

        startBtn.addEventListener('click', startGame);
        stopBtn.addEventListener('click', stopGame);

        window.addEventListener('keydown', (e) => {
            if (e.code === 'Enter' && !isPlaying && !startBtn.disabled) {
                startGame();
            } else if (e.code === 'Space') {
                e.preventDefault(); 
                if (isPlaying) stopGame();
            }
        });
    </script>
</body>
</html>
