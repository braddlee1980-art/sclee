<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>유준이 얼굴 맞추기 V5.3</title>
    <style>
        :root {
            --bg-color: #f8f9fa;
            --primary-color: #333;
            --success-color: #2ecc71;
            --fail-color: #e74c3c;
        }

        body {
            background-color: var(--bg-color);
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            font-family: 'Pretendard', sans-serif;
            overflow: hidden;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
        }

        .version-tag {
            position: absolute;
            top: 20px;
            left: 20px;
            font-size: 14px;
            color: #ccc;
            font-weight: 500;
            z-index: 10;
        }

        .header { text-align: center; margin-bottom: 30px; }
        .score-container {
            display: flex; gap: 40px; background: white;
            padding: 15px 40px; border-radius: 50px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }
        .stat-item { display: flex; flex-direction: column; }
        .label { font-size: 12px; color: #888; letter-spacing: 1px; }
        .value { font-size: 28px; font-weight: 800; color: var(--primary-color); }

        #game-container {
            position: relative;
            width: 100%; max-width: 900px; height: 400px;
            display: flex; align-items: center; justify-content: center;
            overflow: visible;
            cursor: pointer;
        }

        /* 가이드 (face_image_bg1.png / face_image_bg2.png) */
        #target-guide {
            position: absolute; width: 130px; height: 130px;
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
            z-index: 1; opacity: 0.3;
            transition: background-image 0.2s ease-in;
        }

        /* 얼굴 (face_image1.png / face_image2.png) */
        #face {
            position: absolute; width: 120px; height: 120px;
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
            left: 100%; z-index: 5;
            transform: scale(1);
        }

        @keyframes successZoom {
            0% { transform: scale(1) rotate(0deg); opacity: 1; }
            100% { transform: scale(4) rotate(25deg); opacity: 0; }
        }

        .success-animate {
            animation: successZoom 0.7s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards !important;
        }

        .footer { margin-top: 40px; text-align: center; min-height: 80px; }
        #message { font-size: 26px; font-weight: 800; margin-bottom: 8px; }
        .hint { color: #aaa; font-size: 14px; }
    </style>
</head>
<body>

    <div class="version-tag">유준이 얼굴 맞추기 버젼 5.3</div>

    <div class="header">
        <div class="score-container">
            <div class="stat-item">
                <span class="label">SCORE</span>
                <span id="current-score" class="value">0</span>
            </div>
            <div class="stat-item">
                <span class="label">HIGH SCORE</span>
                <span id="high-score" class="value">0</span>
            </div>
        </div>
    </div>

    <div id="game-container">
        <div id="target-guide"></div>
        <div id="face"></div>
    </div>

    <div class="footer">
        <div id="message">터치해서 시작!</div>
        <div id="sub-message" class="hint">이미지가 매번 바뀝니다!</div>
    </div>

    <script>
        const face = document.getElementById('face');
        const guide = document.getElementById('target-guide');
        const container = document.getElementById('game-container');
        const scoreDisplay = document.getElementById('current-score');
        const highScoreDisplay = document.getElementById('high-score');
        const messageDisplay = document.getElementById('message');

        let score = 0;
        let highScore = localStorage.getItem('faceGameHighScoreV5') || 0;
        const initialSpeed = 2.2; 
        let speed = initialSpeed;
        let position = 0;
        let isPlaying = false;
        let canInput = true; 
        let animationId;

        // 이미지 세트 관리 (1 또는 2)
        let currentImageIndex = 1;

        highScoreDisplay.textContent = highScore;

        // 이미지 교체 함수
        function updateImages() {
            // 1과 2를 번갈아 가며 선택 (원한다면 Math.random()으로 완전 랜덤 가능)
            currentImageIndex = (currentImageIndex === 1) ? 2 : 1;
            
            guide.style.backgroundImage = `url('face_image_bg${currentImageIndex}.png')`;
            face.style.backgroundImage = `url('face_image${currentImageIndex}.png')`;
        }

        // 초기 이미지 설정
        updateImages();

        function update() {
            if (!isPlaying) return;
            position -= speed;
            if (position < -120) position = container.offsetWidth;
            face.style.left = position + 'px';
            animationId = requestAnimationFrame(update);
        }

        function handleAction() {
            if (!canInput) return;
            if (!isPlaying) startRound();
            else stopRound();
        }

        function startRound() {
            face.classList.remove('success-animate');
            face.style.opacity = '1';
            
            // 라운드 시작 시 이미지 변경
            updateImages();
            
            position = container.offsetWidth;
            face.style.left = position + 'px';
            
            isPlaying = true;
            canInput = true;
            messageDisplay.textContent = "맞춰보세요!";
            messageDisplay.style.color = "#333";
            update();
        }

        function stopRound() {
            isPlaying = false;
            canInput = false;
            cancelAnimationFrame(animationId);
            
            const targetX = (container.offsetWidth / 2) - 60;
            const offset = Math.abs(position - targetX);
            
            if (offset <= 35) {
                // 성공 판정
                const isPerfect = offset <= 10;
                score += (isPerfect ? 50 : 20);
                speed += 0.5;
                scoreDisplay.textContent = score;
                messageDisplay.textContent = isPerfect ? "PERFECT! ✨" : "GREAT! 👍";
                messageDisplay.style.color = "#2ecc71";

                face.classList.add('success-animate');

                if (score > highScore) {
                    highScore = score;
                    localStorage.setItem('faceGameHighScoreV5', highScore);
                    highScoreDisplay.textContent = highScore;
                }
                
                setTimeout(startRound, 800);
            } else {
                // 실패
                messageDisplay.textContent = "MISS! 😢";
                messageDisplay.style.color = "#e74c3c";
                score = 0;
                speed = initialSpeed;
                scoreDisplay.textContent = score;
                canInput = true;
            }
        }

        window.addEventListener('pointerdown', (e) => {
            e.preventDefault();
            handleAction();
        });
        
        window.addEventListener('keydown', (e) => {
            if (e.code === 'Space' || e.code === 'Enter') handleAction();
        });
    </script>
</body>
</html>
