<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>유준이 얼굴 맞추기 V5.1</title>
    <style>
        :root {
            --bg-color: #f8f9fa;
            --primary-color: #333;
            --success-color: #2ecc71;
            --fail-color: #e74c3c;
            --point-color: #f1c40f;
        }

        body {
            background-color: var(--bg-color);
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
            overflow: hidden;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
        }

        /* 좌측 상단 버전 표시 */
        .version-tag {
            position: absolute;
            top: 20px;
            left: 20px;
            font-size: 14px;
            color: #bbb;
            font-weight: 500;
            z-index: 10;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .score-container {
            display: flex;
            gap: 40px;
            background: white;
            padding: 15px 40px;
            border-radius: 50px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }

        .stat-item {
            display: flex;
            flex-direction: column;
        }

        .label { font-size: 12px; color: #888; text-transform: uppercase; letter-spacing: 1px; }
        .value { font-size: 28px; font-weight: 800; color: var(--primary-color); }

        #game-container {
            position: relative;
            width: 100%;
            max-width: 900px;
            height: 450px;
            background-color: transparent;
            display: flex;
            align-items: center; 
            justify-content: center;
            overflow: hidden;
            cursor: pointer;
        }

        .track-line {
            position: absolute;
            width: 90%;
            height: 2px;
            background: linear-gradient(to right, transparent, #ddd, transparent);
            top: 50%;
            transform: translateY(-50%);
            z-index: 0;
        }

        #target-guide {
            position: absolute;
            width: 130px;
            height: 130px;
            background-image: url('face_image_bg.png');
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
            z-index: 1;
            pointer-events: none;
            filter: grayscale(1) opacity(0.3);
            transition: filter 0.3s;
        }

        #face {
            position: absolute;
            width: 120px;
            height: 120px;
            background-image: url('face_image.png');
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
            background-color: transparent;
            left: 100%; 
            z-index: 2;
            transition: transform 0.6s cubic-bezier(0.165, 0.84, 0.44, 1), opacity 0.5s ease-out;
            will-change: left, transform, opacity;
        }

        #face.success-effect {
            transform: scale(3) rotate(15deg);
            opacity: 0;
        }

        .footer {
            margin-top: 40px;
            text-align: center;
            min-height: 80px;
        }

        #message {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 8px;
            transition: all 0.2s;
        }

        .hint {
            color: #aaa;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <!-- 버전 표시 추가 -->
    <div class="version-tag">유준이 얼굴 맞추기 버젼 5.1</div>

    <div class="header">
        <div class="score-container">
            <div class="stat-item">
                <span class="label">SCORE</span>
                <span id="current-score" class="value">0</span>
            </div>
            <div class="stat-item">
                <span class="label">HIGH SCORE</span>
                <span id="high-score" class="value">0</span>
            </div>
        </div>
    </div>

    <div id="game-container">
        <div class="track-line"></div>
        <div id="target-guide"></div>
        <div id="face"></div>
    </div>

    <div class="footer">
        <div id="message">화면을 눌러서 시작!</div>
        <div id="sub-message" class="hint">정중앙에 맞출수록 높은 점수를 얻습니다.</div>
    </div>

    <script>
        const face = document.getElementById('face');
        const guide = document.getElementById('target-guide');
        const container = document.getElementById('game-container');
        const scoreDisplay = document.getElementById('current-score');
        const highScoreDisplay = document.getElementById('high-score');
        const messageDisplay = document.getElementById('message');
        const subMessageDisplay = document.getElementById('sub-message');

        let score = 0;
        let highScore = localStorage.getItem('faceGameHighScoreV5') || 0;
        
        const initialSpeed = 2.0; 
        let speed = initialSpeed;
        let position = 0;
        let isPlaying = false;
        let canInput = true; 
        let animationId;

        highScoreDisplay.textContent = highScore;

        const getTargetX = () => (container.offsetWidth / 2) - (face.offsetWidth / 2);

        function update() {
            if (!isPlaying) return;
            position -= speed;
            if (position < -face.offsetWidth) {
                position = container.offsetWidth;
            }
            face.style.left = position + 'px';
            animationId = requestAnimationFrame(update);
        }

        function handleAction() {
            if (!canInput) return;
            if (!isPlaying) {
                startRound();
            } else {
                stopRound();
            }
        }

        function startRound() {
            face.classList.remove('success-effect');
            face.style.opacity = '1';
            face.style.transform = 'scale(1) rotate(0deg)';
            guide.style.filter = 'grayscale(0) opacity(0.6)';
            position = container.offsetWidth;
            face.style.left = position + 'px';
            isPlaying = true;
            messageDisplay.textContent = "준비하시고...";
            messageDisplay.style.color = "#333";
            subMessageDisplay.textContent = "지금이야 싶을 때 터치!";
            update();
        }

        function stopRound() {
            isPlaying = false;
            canInput = false; 
            cancelAnimationFrame(animationId);
            
            const targetX = getTargetX();
            const offset = Math.abs(position - targetX);
            
            let earnedScore = 0;
            let resultText = "";
            let textColor = "";

            if (offset <= 8) {
                earnedScore = 50;
                resultText = "PERFECT!!! 🌟";
                textColor = "#f1c40f";
            } else if (offset <= 20) {
                earnedScore = 20;
                resultText = "GREAT! 👍";
                textColor = "#2ecc71";
            } else if (offset <= 35) {
                earnedScore = 10;
                resultText = "GOOD :)";
                textColor = "#3498db";
            } else {
                earnedScore = 0;
            }

            if (earnedScore > 0) {
                score += earnedScore;
                speed += 0.45;
                scoreDisplay.textContent = score;
                messageDisplay.textContent = resultText;
                messageDisplay.style.color = textColor;
                face.classList.add('success-effect');
                guide.style.filter = 'grayscale(0) opacity(1)';
                
                if (score > highScore) {
                    highScore = score;
                    localStorage.setItem('faceGameHighScoreV5', highScore);
                    highScoreDisplay.textContent = highScore;
                }
                
                setTimeout(() => {
                    canInput = true;
                    startRound();
                }, 800);
            } else {
                messageDisplay.textContent = "아까워요! MISS 😢";
                messageDisplay.style.color = "#e74c3c";
                subMessageDisplay.textContent = "다시 도전하려면 화면을 누르세요.";
                score = 0;
                speed = initialSpeed;
                scoreDisplay.textContent = score;
                guide.style.filter = 'grayscale(1) opacity(0.1)';
                canInput = true;
            }
        }

        window.addEventListener('pointerdown', handleAction);
        window.addEventListener('keydown', (e) => {
            if (e.code === 'Space' || e.code === 'Enter') {
                e.preventDefault();
                handleAction();
            }
        });
        window.addEventListener('resize', () => {
            if (!isPlaying) {
                position = container.offsetWidth;
                face.style.left = position + 'px';
            }
        });
    </script>
</body>
</html>
