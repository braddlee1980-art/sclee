<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>유준이 얼굴 맞추기 V5.8 (Impact Update)</title>
    <style>
        :root {
            --bg-color: #f8f9fa;
            --primary-color: #333;
            --success-color: #2ecc71;
            --fail-color: #e74c3c;
        }

        body {
            background-color: var(--bg-color);
            margin: 0; display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            height: 100vh; font-family: 'Pretendard', sans-serif;
            overflow: hidden; user-select: none; -webkit-user-select: none;
            touch-action: manipulation;
        }

        .version-tag {
            position: absolute; top: 20px; left: 20px;
            font-size: 14px; color: #ccc; font-weight: 500; z-index: 10;
        }

        #timer-container {
            position: fixed; top: 0; left: 0; width: 100%; height: 6px;
            background: #eee; z-index: 100;
        }
        #timer-bar {
            width: 0%; height: 100%; background: var(--success-color);
        }

        .header { text-align: center; margin-bottom: 20px; }
        .score-container {
            display: flex; gap: 40px; background: white;
            padding: 15px 40px; border-radius: 50px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }
        .stat-item { display: flex; flex-direction: column; }
        .label { font-size: 12px; color: #888; letter-spacing: 1px; }
        .value { font-size: 28px; font-weight: 800; color: var(--primary-color); }

        #game-container {
            position: relative;
            width: 100%; max-width: 900px; height: 400px;
            display: flex; align-items: center; justify-content: center;
            overflow: visible; cursor: pointer;
        }

        #target-guide {
            position: absolute; width: 130px; height: 130px;
            background-size: contain; background-repeat: no-repeat;
            background-position: center; z-index: 1; opacity: 0.3;
        }

        .face-particle {
            position: absolute; width: 120px; height: 120px;
            background-size: contain; background-repeat: no-repeat;
            background-position: center; left: 100%; z-index: 5;
            will-change: left, transform, opacity;
        }

        /* [성공] 커지면서 사라짐 */
        @keyframes successZoom {
            0% { transform: scale(1) rotate(0deg); opacity: 1; }
            100% { transform: scale(4) rotate(25deg); opacity: 0; }
        }

        /* [실패] 작아지면서 사라짐 */
        @keyframes failShrink {
            0% { transform: scale(1) rotate(0deg); opacity: 1; }
            100% { transform: scale(0.1) rotate(-45deg); opacity: 0; }
        }

        .success-animate {
            animation: successZoom 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards !important;
        }

        .fail-animate {
            animation: failShrink 0.5s ease-in forwards !important;
        }

        .footer { margin-top: 40px; text-align: center; min-height: 80px; }
        #message { font-size: 26px; font-weight: 800; margin-bottom: 8px; transition: color 0.2s; }
        .hint { color: #aaa; font-size: 14px; }
    </style>
</head>
<body>

    <div id="timer-container"><div id="timer-bar"></div></div>
    <div class="version-tag">유준이 얼굴 맞추기 버젼 5.8 (Impact Update)</div>

    <div class="header">
        <div class="score-container">
            <div class="stat-item">
                <span class="label">SCORE</span>
                <span id="current-score" class="value">0</span>
            </div>
            <div class="stat-item">
                <span class="label">HIGH SCORE</span>
                <span id="high-score" class="value">0</span>
            </div>
        </div>
    </div>

    <div id="game-container">
        <div id="target-guide"></div>
    </div>

    <div class="footer">
        <div id="message">터치해서 게임 시작!</div>
        <div id="sub-message" class="hint">놓치면 얼굴이 쪼그라들어요!</div>
    </div>

    <script>
        const container = document.getElementById('game-container');
        const guide = document.getElementById('target-guide');
        const scoreDisplay = document.getElementById('current-score');
        const highScoreDisplay = document.getElementById('high-score');
        const messageDisplay = document.getElementById('message');
        const timerBar = document.getElementById('timer-bar');

        const bgm = new Audio('bg_sound.mp3');
        bgm.loop = false;

        let score = 0;
        let highScore = localStorage.getItem('faceGameHighScoreV5') || 0;
        highScoreDisplay.textContent = highScore;

        const bpm = 175;
        const beatInterval = (60 / bpm) * 1000;
        
        let isPlaying = false;
        let isGameOver = false;
        let activeFaces = [];
        let spawnTimer;

        bgm.addEventListener('ended', () => gameOver());
        bgm.addEventListener('timeupdate', () => {
            if (bgm.duration) {
                timerBar.style.width = (bgm.currentTime / bgm.duration) * 100 + '%';
            }
        });

        function createFace() {
            if (!isPlaying || isGameOver) return;

            const face = document.createElement('div');
            face.className = 'face-particle';
            const imgIdx = (Math.random() > 0.5) ? 1 : 2;
            face.style.backgroundImage = `url('face_image${imgIdx}.png')`;
            
            const faceObj = {
                el: face,
                pos: container.offsetWidth,
                startTime: performance.now(),
                duration: beatInterval * 2,
                processed: false // 판정 완료 여부
            };

            container.appendChild(face);
            activeFaces.push(faceObj);
            spawnTimer = setTimeout(createFace, beatInterval);
        }

        function animate() {
            if (!isPlaying || isGameOver) return;
            const now = performance.now();

            activeFaces.forEach((faceObj, index) => {
                if (faceObj.processed) return;

                const elapsed = now - faceObj.startTime;
                const progress = elapsed / faceObj.duration;
                const currentPos = container.offsetWidth - (container.offsetWidth * progress * 0.8);
                
                faceObj.pos = currentPos;
                faceObj.el.style.left = currentPos + 'px';

                // 타겟 라인을 한참 지나치면 자동으로 실패 처리 (작아짐)
                const targetX = (container.offsetWidth / 2) - 60;
                if (currentPos < targetX - 100) {
                    triggerFail(faceObj);
                }
            });

            requestAnimationFrame(animate);
        }

        function handleAction() {
            if (isGameOver) { location.reload(); return; }

            if (!isPlaying) {
                isPlaying = true;
                bgm.play();
                createFace();
                animate();
                return;
            }

            const targetX = (container.offsetWidth / 2) - 60;
            let closestFace = null;
            let minOffset = 999;

            activeFaces.forEach(f => {
                if (!f.processed) {
                    const off = Math.abs(f.pos - targetX);
                    if (off < minOffset) { minOffset = off; closestFace = f; }
                }
            });

            // 판정 범위 내에 있을 때 터치한 경우
            if (closestFace && minOffset <= 60) {
                const isPerfect = minOffset <= 15;
                score += (isPerfect ? 50 : 20);
                scoreDisplay.textContent = score;
                messageDisplay.textContent = isPerfect ? "PERFECT! 🔥" : "GREAT! 👍";
                messageDisplay.style.color = "#2ecc71";
                
                closestFace.processed = true;
                closestFace.el.classList.add('success-animate');
                
                if (score > highScore) {
                    highScore = score;
                    localStorage.setItem('faceGameHighScoreV5', highScore);
                    highScoreDisplay.textContent = highScore;
                }
                clearFace(closestFace);
            } else {
                // 엉뚱한 데서 누르면 현재 가장 가까운 얼굴을 강제로 실패 처리
                if (closestFace) triggerFail(closestFace);
            }
        }

        function triggerFail(faceObj) {
            if (faceObj.processed) return;
            faceObj.processed = true;
            
            messageDisplay.textContent = "MISS... 😢";
            messageDisplay.style.color = "#e74c3c";
            
            faceObj.el.classList.add('fail-animate');
            clearFace(faceObj);
        }

        function clearFace(faceObj) {
            setTimeout(() => {
                faceObj.el.remove();
                activeFaces = activeFaces.filter(f => f !== faceObj);
            }, 500);
        }

        function gameOver() {
            isGameOver = true;
            isPlaying = false;
            clearTimeout(spawnTimer);
            messageDisplay.innerHTML = `TIME UP! 🏁<br><span style="font-size:40px;">Final Score: ${score}</span>`;
            document.getElementById('sub-message').textContent = "다시 하려면 클릭하세요.";
        }

        window.addEventListener('pointerdown', (e) => { e.preventDefault(); handleAction(); });
        window.addEventListener('keydown', (e) => { if (e.code === 'Space' || e.code === 'Enter') handleAction(); });
    </script>
</body>
</html>
