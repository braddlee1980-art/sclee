<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>얼굴 타이밍 맞추기 게임 V3</title>
    <style>
        body {
            background-color: #f0f0f0;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            font-family: 'Pretendard', sans-serif;
            overflow: hidden;
            /* 텍스트 드래그 방지 (게임 클릭 시 방해 금지) */
            user-select: none;
            -webkit-user-select: none;
        }

        #game-container {
            position: relative;
            width: 100%;
            max-width: 800px;
            height: 400px;
            background-color: transparent;
            border-bottom: 2px solid #ddd;
            display: flex;
            align-items: center; 
            justify-content: center;
            overflow: hidden;
            cursor: pointer; /* 클릭 가능하다는 표시 */
        }

        .scoreboard {
            margin-bottom: 20px;
            text-align: center;
        }
        .score-box {
            font-size: 28px;
            font-weight: bold;
            color: #333;
        }
        .high-score {
            font-size: 16px;
            color: #666;
            margin-top: 5px;
        }

        #target-guide {
            position: absolute;
            width: 130px;
            height: 130px;
            background-image: url('face_image_bg.png');
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
            z-index: 1;
            pointer-events: none;
            opacity: 0.7;
        }

        #face {
            position: absolute;
            width: 120px;
            height: 120px;
            background-image: url('face_image.png');
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
            background-color: transparent;
            left: 100%; 
            z-index: 2;
        }

        #message {
            margin-top: 30px;
            font-size: 20px;
            font-weight: bold;
            height: 30px;
            text-align: center;
        }

        .sub-guide {
            margin-top: 10px;
            color: #888;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <div class="scoreboard">
        <div class="score-box">Score: <span id="current-score">0</span></div>
        <div class="high-score">High Score: <span id="high-score">0</span></div>
    </div>

    <div id="game-container">
        <div id="target-guide"></div>
        <div id="face"></div>
    </div>

    <div id="message">화면을 터치하여 시작하세요!</div>
    <div class="sub-guide">(마우스 클릭 또는 스페이스바도 가능합니다)</div>

    <script>
        const face = document.getElementById('face');
        const container = document.getElementById('game-container');
        const scoreDisplay = document.getElementById('current-score');
        const highScoreDisplay = document.getElementById('high-score');
        const messageDisplay = document.getElementById('message');

        let score = 0;
        let highScore = localStorage.getItem('faceGameHighScore') || 0;
        
        const initialSpeed = 2.6; 
        let speed = initialSpeed;
        
        let position = 800;
        let isPlaying = false;
        let canInput = true; // 중복 클릭 방지용
        let animationId;

        highScoreDisplay.textContent = highScore;

        // 중앙 위치값 계산
        const getTargetX = () => (container.offsetWidth / 2) - (face.offsetWidth / 2);

        function update() {
            if (!isPlaying) return;

            position -= speed;
            
            if (position < -face.offsetWidth) {
                position = container.offsetWidth;
            }

            face.style.left = position + 'px';
            animationId = requestAnimationFrame(update);
        }

        function handleAction() {
            if (!canInput) return;

            if (!isPlaying) {
                // 게임 시작
                startRound();
            } else {
                // 게임 정지 및 판정
                stopRound();
            }
        }

        function startRound() {
            if (position <= -face.offsetWidth || position >= container.offsetWidth - 10) {
                position = container.offsetWidth;
            }
            
            isPlaying = true;
            messageDisplay.textContent = "지금이야! 멈춰!!";
            messageDisplay.style.color = "#333";
            update();
        }

        function stopRound() {
            isPlaying = false;
            canInput = false; // 판정 애니메이션 중 입력 잠금
            cancelAnimationFrame(animationId);
            
            const targetX = getTargetX();
            const offset = Math.abs(position - targetX);
            const tolerance = 25; 

            if (offset <= tolerance) {
                score += 10;
                speed += 0.6;
                scoreDisplay.textContent = score;
                messageDisplay.textContent = "Perfect! 정확해요! 🎯";
                messageDisplay.style.color = "#4CAF50";
                
                if (score > highScore) {
                    highScore = score;
                    localStorage.setItem('faceGameHighScore', highScore);
                    highScoreDisplay.textContent = highScore;
                }
                
                // 1초 뒤 자동으로 다음 라운드 준비
                setTimeout(() => {
                    position = container.offsetWidth;
                    face.style.left = position + 'px';
                    isPlaying = true;
                    canInput = true;
                    messageDisplay.textContent = "다음 라운드 시작!";
                    messageDisplay.style.color = "#333";
                    update();
                }, 1000);

            } else {
                messageDisplay.textContent = "실패! 화면을 눌러 다시 도전!";
                messageDisplay.style.color = "#f44336";
                score = 0;
                speed = initialSpeed;
                scoreDisplay.textContent = score;
                canInput = true;
            }
        }

        // 마우스 클릭 및 터치 이벤트 통합 (pointerdown)
        window.addEventListener('pointerdown', (e) => {
            // 버튼이 아닌 빈 화면이나 컨테이너 클릭 시 작동
            handleAction();
        });

        // 키보드 조작 유지 (스페이스바)
        window.addEventListener('keydown', (e) => {
            if (e.code === 'Space' || e.code === 'Enter') {
                e.preventDefault();
                handleAction();
            }
        });

        // 윈도우 리사이즈 대응
        window.addEventListener('resize', () => {
            if (!isPlaying) {
                face.style.left = '100%';
                position = container.offsetWidth;
            }
        });
    </script>
</body>
</htm
