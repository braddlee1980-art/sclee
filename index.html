<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>얼굴 타이밍 맞추기 게임 V4</title>
    <style>
        body {
            background-color: #f0f0f0;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            font-family: 'Pretendard', sans-serif;
            overflow: hidden;
            user-select: none;
            -webkit-user-select: none;
        }

        #game-container {
            position: relative;
            width: 100%;
            max-width: 800px;
            height: 400px;
            background-color: transparent;
            border-bottom: 2px solid #ddd;
            display: flex;
            align-items: center; 
            justify-content: center;
            overflow: hidden;
            cursor: pointer;
        }

        .scoreboard {
            margin-bottom: 20px;
            text-align: center;
        }
        .score-box {
            font-size: 28px;
            font-weight: bold;
            color: #333;
        }
        .high-score {
            font-size: 16px;
            color: #666;
            margin-top: 5px;
        }

        #target-guide {
            position: absolute;
            width: 130px;
            height: 130px;
            background-image: url('face_image_bg.png');
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
            z-index: 1;
            pointer-events: none;
            opacity: 0.7;
        }

        #face {
            position: absolute;
            width: 120px;
            height: 120px;
            background-image: url('face_image.png');
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
            background-color: transparent;
            left: 100%; 
            z-index: 2;
            transition: transform 0.6s ease-out, opacity 0.6s ease-out; /* 효과용 트랜지션 */
        }

        /* 성공 시 적용될 애니메이션 클래스 */
        #face.success-effect {
            transform: scale(2.5); /* 얼굴이 커짐 */
            opacity: 0;           /* 투명해짐 */
        }

        #message {
            margin-top: 30px;
            font-size: 20px;
            font-weight: bold;
            height: 30px;
            text-align: center;
        }

        .sub-guide {
            margin-top: 10px;
            color: #888;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <div class="scoreboard">
        <div class="score-box">Score: <span id="current-score">0</span></div>
        <div class="high-score">High Score: <span id="high-score">0</span></div>
    </div>

    <div id="game-container">
        <div id="target-guide"></div>
        <div id="face"></div>
    </div>

    <div id="message">화면을 터치하여 시작하세요!</div>
    <div class="sub-guide">(마우스 클릭 또는 스페이스바도 가능합니다)</div>

    <script>
        const face = document.getElementById('face');
        const container = document.getElementById('game-container');
        const scoreDisplay = document.getElementById('current-score');
        const highScoreDisplay = document.getElementById('high-score');
        const messageDisplay = document.getElementById('message');

        let score = 0;
        let highScore = localStorage.getItem('faceGameHighScore') || 0;
        
        const initialSpeed = 2.6; 
        let speed = initialSpeed;
        
        let position = 800;
        let isPlaying = false;
        let canInput = true; 
        let animationId;

        highScoreDisplay.textContent = highScore;

        const getTargetX = () => (container.offsetWidth / 2) - (face.offsetWidth / 2);

        function update() {
            if (!isPlaying) return;

            position -= speed;
            
            if (position < -face.offsetWidth) {
                position = container.offsetWidth;
            }

            face.style.left = position + 'px';
            animationId = requestAnimationFrame(update);
        }

        function handleAction() {
            if (!canInput) return;

            if (!isPlaying) {
                startRound();
            } else {
                stopRound();
            }
        }

        function startRound() {
            // 효과 클래스 제거 및 상태 초기화
            face.classList.remove('success-effect');
            face.style.opacity = '1';
            face.style.transform = 'scale(1)';
            
            if (position <= -face.offsetWidth || position >= container.offsetWidth - 10) {
                position = container.offsetWidth;
            }
            
            isPlaying = true;
            messageDisplay.textContent = "지금이야! 멈춰!!";
            messageDisplay.style.color = "#333";
            update();
        }

        function stopRound() {
            isPlaying = false;
            canInput = false; 
            cancelAnimationFrame(animationId);
            
            const targetX = getTargetX();
            const offset = Math.abs(position - targetX);
            const tolerance = 25; 

            if (offset <= tolerance) {
                // 성공 판정
                score += 10;
                speed += 0.6;
                scoreDisplay.textContent = score;
                messageDisplay.textContent = "Great! 🎯";
                messageDisplay.style.color = "#4CAF50";

                // [핵심] 성공 효과 적용
                face.classList.add('success-effect');
                
                if (score > highScore) {
                    highScore = score;
                    localStorage.setItem('faceGameHighScore', highScore);
                    highScoreDisplay.textContent = highScore;
                }
                
                // 효과가 끝난 뒤 다음 라운드 준비
                setTimeout(() => {
                    face.classList.remove('success-effect');
                    face.style.opacity = '1';
                    face.style.transform = 'scale(1)';
                    position = container.offsetWidth;
                    face.style.left = position + 'px';
                    
                    canInput = true;
                    startRound(); // 자동 다음 라운드 시작
                }, 700);

            } else {
                // 실패 판정
                messageDisplay.textContent = "실패! 다시 도전하려면 화면 클릭!";
                messageDisplay.style.color = "#f44336";
                score = 0;
                speed = initialSpeed;
                scoreDisplay.textContent = score;
                canInput = true;
            }
        }

        window.addEventListener('pointerdown', (e) => {
            handleAction();
        });

        window.addEventListener('keydown', (e) => {
            if (e.code === 'Space' || e.code === 'Enter') {
                e.preventDefault();
                handleAction();
            }
        });

        window.addEventListener('resize', () => {
            if (!isPlaying) {
                position = container.offsetWidth;
                face.style.left = position + 'px';
            }
        });
    </script>
</body>
</html>
