<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>유준이 얼굴 맞추기 V6.0 (Dual Target)</title>
    <style>
        :root {
            --bg-color: #f8f9fa;
            --primary-color: #333;
            --success-color: #2ecc71;
            --fail-color: #e74c3c;
        }

        body {
            background-color: var(--bg-color);
            margin: 0; display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            height: 100vh; font-family: 'Pretendard', sans-serif;
            overflow: hidden; user-select: none; -webkit-user-select: none;
            touch-action: manipulation;
        }

        .version-tag {
            position: absolute; top: 20px; left: 20px;
            font-size: 14px; color: #ccc; font-weight: 500; z-index: 10;
        }

        #timer-container {
            position: fixed; top: 0; left: 0; width: 100%; height: 6px;
            background: #eee; z-index: 100;
        }
        #timer-bar { width: 0%; height: 100%; background: var(--success-color); }

        .header { text-align: center; margin-bottom: 20px; }
        .score-container {
            display: flex; gap: 40px; background: white;
            padding: 15px 40px; border-radius: 50px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }
        .stat-item { display: flex; flex-direction: column; }
        .label { font-size: 12px; color: #888; letter-spacing: 1px; }
        .value { font-size: 28px; font-weight: 800; color: var(--primary-color); }

        #game-container {
            position: relative;
            width: 100%; max-width: 1000px; height: 400px;
            display: flex; align-items: center; justify-content: center;
            overflow: visible; cursor: pointer;
        }

        /* 공통 가이드 스타일 */
        .guide {
            position: absolute; width: 140px; height: 140px;
            background-size: contain; background-repeat: no-repeat;
            background-position: center; z-index: 1; opacity: 0.25;
        }

        /* 왼쪽 가이드: 중앙과 왼쪽 끝의 중간 (25% 지점) */
        #guide-left {
            left: 25%; transform: translateX(-50%);
            background-image: url('face_image_bg.png');
        }

        /* 오른쪽 가이드: 중앙과 오른쪽 끝의 중간 (75% 지점) */
        #guide-right {
            left: 75%; transform: translateX(-50%);
            background-image: url('face_image_bg1.png');
        }

        .face-particle {
            position: absolute; width: 120px; height: 120px;
            background-size: contain; background-repeat: no-repeat;
            background-position: center; left: 100%; z-index: 5;
            will-change: left, transform, opacity;
        }

        @keyframes successZoom {
            0% { transform: scale(1) rotate(0deg); opacity: 1; }
            100% { transform: scale(4) rotate(25deg); opacity: 0; }
        }

        @keyframes failShrink {
            0% { transform: scale(1) rotate(0deg); opacity: 1; }
            100% { transform: scale(0.1) rotate(-45deg); opacity: 0; }
        }

        .success-animate { animation: successZoom 0.4s forwards !important; }
        .fail-animate { animation: failShrink 0.5s forwards !important; }

        .footer { margin-top: 40px; text-align: center; min-height: 80px; }
        #message { font-size: 26px; font-weight: 800; margin-bottom: 8px; }
    </style>
</head>
<body>

    <div id="timer-container"><div id="timer-bar"></div></div>
    <div class="version-tag">유준이 얼굴 맞추기 버젼 6.0 (Dual Target)</div>

    <div class="header">
        <div class="score-container">
            <div class="stat-item">
                <span class="label">SCORE</span>
                <span id="current-score" class="value">0</span>
            </div>
            <div class="stat-item">
                <span class="label">HIGH SCORE</span>
                <span id="high-score" class="value">0</span>
            </div>
        </div>
    </div>

    <div id="game-container">
        <div id="guide-left" class="guide"></div>
        <div id="guide-right" class="guide"></div>
    </div>

    <div class="footer">
        <div id="message">터치해서 양쪽 타겟을 공략하세요!</div>
    </div>

    <script>
        const container = document.getElementById('game-container');
        const scoreDisplay = document.getElementById('current-score');
        const highScoreDisplay = document.getElementById('high-score');
        const messageDisplay = document.getElementById('message');
        const timerBar = document.getElementById('timer-bar');

        const bgm = new Audio('bg_sound.mp3');
        const bpm = 175;
        const beatInterval = (60 / bpm) * 1000;
        
        let score = 0;
        let highScore = localStorage.getItem('faceGameHighScoreV5') || 0;
        let isPlaying = false;
        let isGameOver = false;
        let activeFaces = [];
        let spawnTimer;

        highScoreDisplay.textContent = highScore;

        bgm.addEventListener('ended', () => gameOver());
        bgm.addEventListener('timeupdate', () => {
            if (bgm.duration) timerBar.style.width = (bgm.currentTime / bgm.duration) * 100 + '%';
        });

        function createFace() {
            if (!isPlaying || isGameOver) return;
            const face = document.createElement('div');
            face.className = 'face-particle';
            const imgIdx = (Math.random() > 0.5) ? 1 : 2;
            face.style.backgroundImage = `url('face_image${imgIdx}.png')`;
            
            const faceObj = {
                el: face,
                pos: container.offsetWidth,
                startTime: performance.now(),
                duration: beatInterval * 3, // 타겟이 두 개라 조금 더 여유 있게 흐르게 설정
                processed: false
            };
            container.appendChild(face);
            activeFaces.push(faceObj);
            spawnTimer = setTimeout(createFace, beatInterval);
        }

        function animate() {
            if (!isPlaying || isGameOver) return;
            const now = performance.now();

            activeFaces.forEach((faceObj, index) => {
                if (faceObj.processed) return;
                const progress = (now - faceObj.startTime) / faceObj.duration;
                const currentPos = container.offsetWidth - (container.offsetWidth * progress);
                
                faceObj.pos = currentPos;
                faceObj.el.style.left = currentPos + 'px';

                // 화면 왼쪽 끝을 완전히 벗어나면 실패 처리
                if (currentPos < -120) triggerFail(faceObj);
            });
            requestAnimationFrame(animate);
        }

        function handleAction() {
            if (isGameOver) { location.reload(); return; }
            if (!isPlaying) {
                isPlaying = true;
                bgm.play();
                createFace();
                animate();
                return;
            }

            const faceWidth = 120;
            // 타겟 위치 계산 (px 단위)
            const leftTargetX = (container.offsetWidth * 0.25) - 70;
            const rightTargetX = (container.offsetWidth * 0.75) - 70;
            
            let targetFace = null;
            let currentType = "";

            // 가장 적절한 타겟 얼굴 찾기 (왼쪽 혹은 오른쪽 가이드에 겹친 녀석)
            activeFaces.forEach(f => {
                if (f.processed) return;

                // 오른쪽 가이드 중첩 계산
                const overlapR = calculateOverlap(f.pos, rightTargetX, faceWidth);
                if (overlapR >= 0.7) {
                    targetFace = f;
                    currentType = "right";
                }

                // 왼쪽 가이드 중첩 계산 (왼쪽이 더 나중에 오므로 우선순위 높임)
                const overlapL = calculateOverlap(f.pos, leftTargetX, faceWidth);
                if (overlapL >= 0.7) {
                    targetFace = f;
                    currentType = "left";
                }
            });

            if (targetFace) {
                const isPerfect = calculateOverlap(targetFace.pos, (currentType === "left" ? leftTargetX : rightTargetX), faceWidth) >= 0.9;
                score += (isPerfect ? 50 : 20);
                scoreDisplay.textContent = score;
                messageDisplay.textContent = isPerfect ? "PERFECT! 🔥" : "GOOD! 👍";
                messageDisplay.style.color = "#2ecc71";
                
                targetFace.processed = true;
                targetFace.el.classList.add('success-animate');
                
                if (score > highScore) {
                    highScore = score;
                    localStorage.setItem('faceGameHighScoreV5', highScore);
                    highScoreDisplay.textContent = highScore;
                }
                clearFace(targetFace);
            } else {
                // 아무것도 안 겹쳤을 때 누르면 가장 앞선 얼굴 실패 처리
                const frontFace = activeFaces.find(f => !f.processed);
                if (frontFace) triggerFail(frontFace);
            }
        }

        function calculateOverlap(pos1, pos2, width) {
            const overlap = Math.max(0, Math.min(pos1 + width, pos2 + width) - Math.max(pos1, pos2));
            return overlap / width;
        }

        function triggerFail(faceObj) {
            if (faceObj.processed) return;
            faceObj.processed = true;
            messageDisplay.textContent = "MISS... 😢";
            messageDisplay.style.color = "#e74c3c";
            faceObj.el.classList.add('fail-animate');
            clearFace(faceObj);
        }

        function clearFace(faceObj) {
            setTimeout(() => {
                faceObj.el.remove();
                activeFaces = activeFaces.filter(f => f !== faceObj);
            }, 500);
        }

        function gameOver() {
            isGameOver = true;
            isPlaying = false;
            clearTimeout(spawnTimer);
            messageDisplay.innerHTML = `TIME UP! 🏁<br><span style="font-size:36px;">Final Score: ${score}</span>`;
        }

        window.addEventListener('pointerdown', (e) => { e.preventDefault(); handleAction(); });
        window.addEventListener('keydown', (e) => { if (e.code === 'Space' || e.code === 'Enter') handleAction(); });
    </script>
</body>
</html>
