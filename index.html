<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>유준이 얼굴 맞추기 V5.7 (175 BPM - Full Song)</title>
    <style>
        :root {
            --bg-color: #f8f9fa;
            --primary-color: #333;
            --success-color: #2ecc71;
            --fail-color: #e74c3c;
            --point-color: #f1c40f;
        }

        body {
            background-color: var(--bg-color);
            margin: 0; display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            height: 100vh; font-family: 'Pretendard', sans-serif;
            overflow: hidden; user-select: none; -webkit-user-select: none;
            touch-action: manipulation;
        }

        .version-tag {
            position: absolute; top: 20px; left: 20px;
            font-size: 14px; color: #ccc; font-weight: 500; z-index: 10;
        }

        /* 시간 진행 바 */
        #timer-container {
            position: fixed; top: 0; left: 0; width: 100%; height: 6px;
            background: #eee; z-index: 100;
        }
        #timer-bar {
            width: 0%; height: 100%; background: var(--success-color);
            transition: width 0.1s linear;
        }

        .header { text-align: center; margin-bottom: 20px; }
        .score-container {
            display: flex; gap: 40px; background: white;
            padding: 15px 40px; border-radius: 50px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }
        .stat-item { display: flex; flex-direction: column; }
        .label { font-size: 12px; color: #888; letter-spacing: 1px; }
        .value { font-size: 28px; font-weight: 800; color: var(--primary-color); }

        #game-container {
            position: relative;
            width: 100%; max-width: 900px; height: 400px;
            display: flex; align-items: center; justify-content: center;
            overflow: visible; cursor: pointer;
        }

        #target-guide {
            position: absolute; width: 130px; height: 130px;
            background-size: contain; background-repeat: no-repeat;
            background-position: center; z-index: 1; opacity: 0.3;
        }

        .face-particle {
            position: absolute; width: 120px; height: 120px;
            background-size: contain; background-repeat: no-repeat;
            background-position: center; left: 100%; z-index: 5;
            will-change: left, transform, opacity;
        }

        @keyframes successZoom {
            0% { transform: scale(1) rotate(0deg); opacity: 1; }
            100% { transform: scale(4) rotate(25deg); opacity: 0; }
        }

        .success-animate {
            animation: successZoom 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards !important;
        }

        .footer { margin-top: 40px; text-align: center; min-height: 80px; }
        #message { font-size: 26px; font-weight: 800; margin-bottom: 8px; }
        .hint { color: #aaa; font-size: 14px; }
    </style>
</head>
<body>

    <div id="timer-container"><div id="timer-bar"></div></div>
    <div class="version-tag">유준이 얼굴 맞추기 버젼 5.7 (Full Song)</div>

    <div class="header">
        <div class="score-container">
            <div class="stat-item">
                <span class="label">SCORE</span>
                <span id="current-score" class="value">0</span>
            </div>
            <div class="stat-item">
                <span class="label">HIGH SCORE</span>
                <span id="high-score" class="value">0</span>
            </div>
        </div>
    </div>

    <div id="game-container">
        <div id="target-guide"></div>
    </div>

    <div class="footer">
        <div id="message">화면을 눌러서 노래 시작!</div>
        <div id="sub-message" class="hint">음악이 끝날 때까지 최대한 많은 점수를 얻으세요!</div>
    </div>

    <script>
        const container = document.getElementById('game-container');
        const guide = document.getElementById('target-guide');
        const scoreDisplay = document.getElementById('current-score');
        const highScoreDisplay = document.getElementById('high-score');
        const messageDisplay = document.getElementById('message');
        const timerBar = document.getElementById('timer-bar');

        const bgm = new Audio('bg_sound.mp3');
        bgm.loop = false; // 음악이 끝나면 게임을 종료해야 하므로 loop는 false

        let score = 0;
        let highScore = localStorage.getItem('faceGameHighScoreV5') || 0;
        highScoreDisplay.textContent = highScore;

        const bpm = 175;
        const beatInterval = (60 / bpm) * 1000;
        
        let isPlaying = false;
        let isGameOver = false;
        let currentImageIndex = 1;
        let activeFaces = [];
        let spawnTimer;

        // 음악 종료 시 이벤트 리스너
        bgm.addEventListener('ended', () => {
            gameOver();
        });

        // 진행 바 업데이트
        bgm.addEventListener('timeupdate', () => {
            if (bgm.duration) {
                const progress = (bgm.currentTime / bgm.duration) * 100;
                timerBar.style.width = progress + '%';
            }
        });

        function updateGuideImage() {
            currentImageIndex = (currentImageIndex === 1) ? 2 : 1;
            guide.style.backgroundImage = `url('face_image_bg${currentImageIndex}.png')`;
        }

        function createFace() {
            if (!isPlaying || isGameOver) return;

            const face = document.createElement('div');
            face.className = 'face-particle';
            const imgIdx = (Math.random() > 0.5) ? 1 : 2;
            face.style.backgroundImage = `url('face_image${imgIdx}.png')`;
            
            const startPos = container.offsetWidth;
            const targetPos = (container.offsetWidth / 2) - 60;
            
            const faceObj = {
                el: face,
                pos: startPos,
                startTime: performance.now(),
                duration: beatInterval * 2, 
                hit: false
            };

            container.appendChild(face);
            activeFaces.push(faceObj);

            spawnTimer = setTimeout(createFace, beatInterval);
        }

        function animate() {
            if (!isPlaying || isGameOver) return;
            const now = performance.now();

            activeFaces.forEach((faceObj, index) => {
                if (faceObj.hit) return;

                const elapsed = now - faceObj.startTime;
                const progress = elapsed / faceObj.duration;
                const currentPos = container.offsetWidth - (container.offsetWidth * progress * 0.8);
                
                faceObj.pos = currentPos;
                faceObj.el.style.left = currentPos + 'px';

                if (currentPos < -120) {
                    faceObj.el.remove();
                    activeFaces.splice(index, 1);
                }
            });

            requestAnimationFrame(animate);
        }

        function handleAction() {
            if (isGameOver) {
                location.reload(); // 게임 오버 후 클릭하면 재시작
                return;
            }

            if (!isPlaying) {
                isPlaying = true;
                bgm.play().catch(e => console.log("재생 오류:", e));
                score = 0;
                scoreDisplay.textContent = score;
                messageDisplay.textContent = "음악 종료까지 가즈아!!";
                updateGuideImage();
                createFace();
                animate();
                return;
            }

            if (activeFaces.length === 0) return;

            const targetX = (container.offsetWidth / 2) - 60;
            let closestFace = null;
            let minOffset = 999;

            activeFaces.forEach(f => {
                if (!f.hit) {
                    const off = Math.abs(f.pos - targetX);
                    if (off < minOffset) {
                        minOffset = off;
                        closestFace = f;
                    }
                }
            });

            if (closestFace && minOffset <= 50) {
                const isPerfect = minOffset <= 15;
                score += (isPerfect ? 50 : 20);
                scoreDisplay.textContent = score;
                messageDisplay.textContent = isPerfect ? "PERFECT! 🔥" : "GREAT! 👍";
                messageDisplay.style.color = isPerfect ? "#f1c40f" : "#2ecc71";

                closestFace.hit = true;
                closestFace.el.classList.add('success-animate');
                
                if (score > highScore) {
                    highScore = score;
                    localStorage.setItem('faceGameHighScoreV5', highScore);
                    highScoreDisplay.textContent = highScore;
                }

                setTimeout(() => {
                    closestFace.el.remove();
                    activeFaces = activeFaces.filter(f => f !== closestFace);
                }, 400);
                
                updateGuideImage();
            }
        }

        function gameOver() {
            isGameOver = true;
            isPlaying = false;
            clearTimeout(spawnTimer);
            
            // 모든 얼굴 제거
            activeFaces.forEach(f => f.el.remove());
            activeFaces = [];

            messageDisplay.innerHTML = `TIME UP! 🏁<br><span style="font-size:40px; color:#333;">최종 점수: ${score}</span>`;
            messageDisplay.style.color = "#333";
            document.getElementById('sub-message').textContent = "다시 하려면 화면을 클릭하세요.";
            timerBar.style.width = '100%';
            timerBar.style.background = '#333';
        }

        window.addEventListener('pointerdown', (e) => {
            e.preventDefault();
            handleAction();
        });
        
        window.addEventListener('keydown', (e) => {
            if (e.code === 'Space' || e.code === 'Enter') handleAction();
        });
    </script>
</body>
</html>
