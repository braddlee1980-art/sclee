<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, shrink-to-fit=no">
    <title>MapPhoto - 사진 지도 아카이브</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">

    <style>
        /* 웹 및 모바일/태블릿 기본 레이아웃 초기화 */
        * {
            box-sizing: border-radius;
            margin: 0;
            padding: 0;
        }
        
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'Noto Sans KR', sans-serif;
            background-color: #f1f2f6;
        }

        /* [핵심 수정] 아이패드 렌더링 엔진(WebKit)에서 지도가 축소/숨김 처리되는 현상 완전 방어 */
        #map-container {
            width: 100%;
            height: 100vh;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
            background-color: #e5e3df; /* 지도 로드 전 더미 배경색 */
        }

        /* 폰트 스타일 강제 바인딩 */
        .map-photo-marker {
            font-family: 'Noto Sans KR', sans-serif;
        }
    </style>

    <script type="text/javascript" src="https://oapi.map.naver.com/openapi/v3/maps.js?ncpClientId=ha69a2ib96"></script>

    <script src="https://cdn.jsdelivr.net/npm/exif-js" defer></script>
    <script src="images-list.js" defer></script>

    <script src="photomodal.js" defer></script>
    <script src="photomarker.js" defer></script>
    <script src="photoviewthumbnail.js" defer></script>
</head>
<body>

    <div id="map-container"></div>

</body>
</html>
