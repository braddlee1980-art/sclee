name: Generate Image List Automatically

on:
  push:
    paths:
      - 'img/**' # img 폴더에 변화가 있을 때만 실행

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # 갱신된 파일 커밋 권한 부여

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-size: '20'

    - name: Run script to generate image list
      run: node generate-list.js

    - name: Commit and Push if changed
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add images-list.js
        git diff-index --quiet HEAD || git commit -m "chore: 고정 이미지 목록 자동 갱신 [skip ci]"
        git push
